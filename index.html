<html lang="tr">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Deliorman Danışmanlık</title>

    <!-- Open Graph / Sosyal Medya Paylaşım Kartı -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Deliorman Danışmanlık | Bulgaristan Vize ve Pasaport Danışmanlığı" />

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

    <!-- Netlify'ın build sırasında formu algılayabilmesi için statik form (gizli, gerçek gönderim App.vue'dan fetch ile yapılır) -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
